<!DOCTYPE html>
<html>
    <head>
        <title>Website</title>
        <style>
            .navstyle{
                display: flex;
                flex-direction: column;
                padding: 20px;
                gap: 5px;
                background-color: lightblue;
            }
            .navstyle a{
                text-decoration: none;
                color: black;
            }
            @media (min-width: 1024px) {
                .navstyle{
                    flex-direction: row;
                    gap: 10px;
                    align-items: center;
                }
            }
            .imgstyle{
                width: 600px;
                border: solid black;
                border-radius: 30px;
            }
            .videostyle{
                width: 50%;
                height: auto;
                background-color: purple;
                padding: 10px;
            }
            .tablestyle{
                background-color: lightyellow;
                width: 50%;
            }
            .tablestyle tr,
            .tablestyle th,
            .tablestyle td{
                padding: 20px;
            }
            .buttonstyle{
                width: 150px;
                padding: 5px;
                color: white;
                background-color: purple;
                border: 5px solid white;
                border-radius: 20px;
                cursor: pointer;
            }
            .buttonstyle:hover{
                background-color: black;
            }
        </style>
    </head>
    <body>
        <nav class="navstyle">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        
        <h1>GG Trading Academy</h1>
        
        <div><img class="imgstyle" src="tradingpic.jpg"></div>

        <div><video controls class="videostyle">
            <source src="tradingvideo.mp4" type="video/mp4">
        </video></div>

        <table class="tablestyle" border="1">
            <tr class="headerstyle">
                <th>Course</th>
                <th>Duration</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Investment Basics</td>
                <td>1 week</td>
                <td>5000</td>
            </tr>
            <tr>
                <td>Trading Techniques</td>
                <td>2 week</td>
                <td>10,000</td>
            </tr>
            <tr>
                <td>Complete Trading Course (with option strategies)</td>
                <td>4 week</td>
                <td>15,000</td>
            </tr>
        </table>
        <button class="buttonstyle">
                JOIN NOW
        </button>
    </body>
</html>
