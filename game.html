<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Network Terminal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#00ff66;
    font-family:Consolas,monospace;
    overflow:hidden;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

#terminal{
    width:90%;
    max-width:1000px;
    height:85vh;
    margin:30px auto;
    border:1px solid #00ff66;
    background:rgba(0,0,0,.85);
    box-shadow:0 0 30px #00ff66;
    overflow:hidden;
}

.header{
    padding:15px;
    background:#001a0d;
    border-bottom:1px solid #00ff66;
}

.header h2{
    color:#00ff66;
}

.content{
    padding:20px;
    height:calc(100% - 70px);
    overflow-y:auto;
}

.line{
    margin:8px 0;
    white-space:pre-wrap;
}

.red{
    color:#ff4444;
}

.yellow{
    color:#ffcc00;
}

.green{
    color:#00ff66;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

#reveal{
    display:none;
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle,#120022,#000);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

#reveal h1{
    font-size:5rem;
    text-shadow:0 0 25px #ff00ff;
}

#reveal h2{
    font-size:2rem;
    margin:20px 0;
}

#reveal p{
    max-width:700px;
    font-size:1.2rem;
    line-height:1.8;
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="terminal">

<div class="header">
<h2>ANONYMOUS INTELLIGENCE NODE v13.7</h2>
</div>

<div class="content" id="logs"></div>

</div>

<div id="reveal">

<div style="font-size:120px">🎂</div>

<h1>HAPPY BIRTHDAY</h1>

<h2>BIRTHDAY_PERSON</h2>

<p>
CLASSIFIED REPORT COMPLETE.

After scanning global intelligence databases,
encrypted networks, satellites, and hidden servers...

One critical result was found:

TODAY IS YOUR BIRTHDAY 🎉

Mission Status: CELEBRATE IMMEDIATELY.
</p>

</div>

<script>

/* MATRIX EFFECT */

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";
const size=16;
const columns=Math.floor(canvas.width/size);

const drops=[];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function drawMatrix(){

    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff66";
    ctx.font=size+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text=
        chars[Math.floor(Math.random()*chars.length)];

        ctx.fillText(text,i*size,drops[i]*size);

        if(drops[i]*size>canvas.height &&
           Math.random()>0.975){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix,35);

/* TERMINAL */

const logs=document.getElementById("logs");

const messages=[

"[BOOT] Initializing anonymous relay...",
"[NODE] Connecting hidden endpoints...",
"[SCAN] Searching encrypted archives...",
"[SCAN] Cross-referencing databases...",
"[ALERT] Unusual celebration signature detected...",
"[TRACE] Locating target profile...",
"[TRACE] Birthday probability increasing...",
"[ACCESS] Party records discovered...",
"[WARNING] Cake detected...",
"[CRITICAL] Gift inventory located...",
"[INTEL] Balloon activity confirmed...",
"[FINAL] Preparing classified report..."

];

let index=0;

function addLine(text,cls="green"){

    const div=document.createElement("div");

    div.className="line "+cls;

    div.textContent=text;

    logs.appendChild(div);

    logs.scrollTop=logs.scrollHeight;
}

const run=setInterval(()=>{

    const msg=messages[index];

    let color="green";

    if(msg.includes("WARNING"))
        color="yellow";

    if(msg.includes("CRITICAL"))
        color="red";

    addLine(msg,color);

    index++;

    if(index>=messages.length){

        clearInterval(run);

        setTimeout(()=>{

            document.getElementById("terminal")
            .style.display="none";

            document.getElementById("reveal")
            .style.display="flex";

            confetti();

        },2500);
    }

},1200);

function confetti(){

    const colors=[
        "#ff0000",
        "#00ff00",
        "#ffff00",
        "#00ffff",
        "#ff00ff",
        "#ffffff"
    ];

    setInterval(()=>{

        for(let i=0;i<20;i++){

            const c=document.createElement("div");

            c.className="confetti";

            c.style.left=Math.random()*100+"vw";

            c.style.background=
            colors[Math.floor(Math.random()*colors.length)];

            c.style.animationDuration=
            (Math.random()*3+2)+"s";

            document.body.appendChild(c);

            setTimeout(()=>c.remove(),5000);
        }

    },250);
}
</script>

</body>
</html>
